# =============================================================================
# LAYER 2 / LAYER 3 — not fetched in v1. Kept for a future version.
# (Signals = engagement boost; Competitors = consensus/hidden-gem meta-curation.)
# Note: many of these URLs were also dead on 2026-06-30 (TLDR, Ben's Bites,
# The Rundown). Re-verify before enabling. Live as of 2026-06-30: Sidebar.io,
# HN feeds, Product Hunt, r/cursor.
# =============================================================================
layer_2_signals:
  hacker_news:
    - { name: "HN front page (200+ points)", url: "https://hnrss.org/frontpage?points=200", weight: 1.0, lang: en, tags: [hn, signal] }
    - { name: "HN — AI/agent keywords", url: "https://hnrss.org/newest?q=AI+OR+agent+OR+LLM+OR+Claude+OR+Cursor+OR+Lovable&points=100", weight: 1.0, lang: en, tags: [hn, ai, signal] }
  reddit:
    - { name: "r/cursor (top weekly)", url: "https://www.reddit.com/r/cursor/top/.rss?t=week", weight: 1.0, lang: en, tags: [reddit, cursor, signal] }
  product_hunt:
    - { name: "Product Hunt — Design Tools", url: "https://www.producthunt.com/feed?category=design-tools", weight: 1.1, lang: en, tags: [ph, design, signal] }

layer_3_competitors:
  design_digests:
    - { name: "Sidebar.io", url: "https://sidebar.io/feed.xml", weight: 1.3, lang: en, tags: [digest, design, daily] }
