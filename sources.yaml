# =============================================================================
# Design Signal — RSS Sources (v4, design-first)
# =============================================================================
# Focus: AI × product design × design tooling, for a UX/UI product designer.
# See design-signal-brief.md for the editorial spec this implements.
#
# WHAT CHANGED IN v4 (2026-06-30):
#   - Removed the infra/model-race firehose that flooded the channel with Vercel:
#     Vercel atom (1294 items!), arXiv cs.AI, Tailwind, shadcn, Apple/Google dev.
#     They are NOT deleted — moved to `quarantine` below with the reason.
#   - All design-tool first-party RSS feeds were DEAD (Figma/Framer/Cursor/Lovable/
#     Anthropic/v0 all 404 or not-a-feed). Replaced with Google News RSS queries
#     that reliably surface those tools' releases. Verified live 2026-06-30.
#   - Added verified live design publications (UX Collective, Smashing, NN/g,
#     Builder.io, Lenny's).
#
# Only `layer_1_primary` is fetched (see src/fetch.py). Layers 2/3 are kept for
# a future version. Dead/quarantined sources live OUTSIDE layer_1_primary so they
# are documented but never fetched.
#
# Run `python3 verify_feeds.py` after editing to confirm everything is live.
# =============================================================================

layer_1_primary:

  # --- TOOL NEWS via Google News RSS (the core: catches releases reliably) ---
  # These surface third-party coverage of each tool's launches/updates. The
  # scoring prompt (prompts/scoring.txt) filters out infra/noise, so broad is OK.
  tool_news:
    - name: "Figma (news)"
      url: "https://news.google.com/rss/search?q=Figma%20%28update%20OR%20launch%20OR%20feature%20OR%20Make%20OR%20Config%20OR%20Motion%29%20when%3A14d&hl=en-US&gl=US&ceid=US:en"
      weight: 1.6
      lang: en
      tags: [figma, ai, design-tool]
      notes: "Config/Make/Motion/Code Layers/agent — central to the channel."

    - name: "Claude Design / Anthropic (news)"
      url: "https://news.google.com/rss/search?q=%28Anthropic%20OR%20%22Claude%20Design%22%29%20%28design%20OR%20Artifacts%20OR%20canvas%29%20when%3A14d&hl=en-US&gl=US&ceid=US:en"
      weight: 1.5
      lang: en
      tags: [anthropic, claude, design-tool, design-to-code]
      notes: "Claude Design, design->code handoff, Artifacts."

    - name: "Framer (news)"
      url: "https://news.google.com/rss/search?q=Framer%20%28AI%20OR%20update%20OR%20feature%20OR%20launch%20OR%20agent%29%20when%3A14d&hl=en-US&gl=US&ceid=US:en"
      weight: 1.4
      lang: en
      tags: [framer, ai, design-tool]

    - name: "Lovable (news)"
      url: "https://news.google.com/rss/search?q=%22Lovable%22%20%28AI%20app%20builder%20OR%20update%20OR%20feature%29%20when%3A14d&hl=en-US&gl=US&ceid=US:en"
      weight: 1.2
      lang: en
      tags: [lovable, ai, text-to-app, prototyping]

    - name: "Cursor (news)"
      url: "https://news.google.com/rss/search?q=%22Cursor%22%20%28AI%20editor%20OR%20coding%20OR%20update%20OR%20release%29%20when%3A14d&hl=en-US&gl=US&ceid=US:en"
      weight: 1.1
      lang: en
      tags: [cursor, ai, ide]
      notes: "Noisier query — rely on scoring to filter non-design items."

    - name: "v0 by Vercel (news)"
      url: "https://news.google.com/rss/search?q=%22v0%22%20Vercel%20%28update%20OR%20feature%20OR%20design%29%20when%3A14d&hl=en-US&gl=US&ceid=US:en"
      weight: 1.1
      lang: en
      tags: [v0, vercel, generative-ui]

    - name: "AI design tools (broad)"
      url: "https://news.google.com/rss/search?q=AI%20design%20tool%20%28Figma%20OR%20Framer%20OR%20Lovable%20OR%20Cursor%20OR%20prototyping%29%20when%3A7d&hl=en-US&gl=US&ceid=US:en"
      weight: 1.3
      lang: en
      tags: [ai, design-tool, roundup]
      notes: "Catch-all for new entrants and cross-tool stories."

  # --- DESIGN PUBLICATIONS (verified live first-party RSS, 2026-06-30) ---
  design_publications:
    - name: "UX Collective"
      url: "https://uxdesign.cc/feed"
      weight: 1.3
      lang: en
      tags: [ux, product-design, editorial]
      notes: "Largest design publication. AI×design coverage; scoring filters non-AI."

    - name: "Builder.io blog"
      url: "https://www.builder.io/blog/feed.xml"
      weight: 1.3
      lang: en
      tags: [design-to-code, visual-copilot, ai]
      notes: "Design->code handoff, figma-to-code — squarely on brand."

    - name: "Lenny's Newsletter"
      url: "https://www.lennysnewsletter.com/feed"
      weight: 1.2
      lang: en
      tags: [product, ai, workflow]
      notes: "AI × product. Filter to AI/workflow pieces via scoring."

    - name: "Smashing Magazine"
      url: "https://www.smashingmagazine.com/feed/"
      weight: 1.0
      lang: en
      tags: [design, frontend, editorial]
      notes: "High volume incl. non-AI (wallpapers etc). Scoring must gate hard."

    - name: "Nielsen Norman Group"
      url: "https://www.nngroup.com/feed/rss/"
      weight: 0.9
      lang: en
      tags: [ux, research]
      notes: "Classic UX. Only AI-angled pieces should pass."

  # --- AI labs (kept minimal — only when a model move affects designers) ---
  ai_labs:
    - name: "OpenAI blog"
      url: "https://openai.com/blog/rss.xml"
      weight: 1.0
      lang: en
      tags: [openai, gpt, models]
      notes: "Down-weighted. Scoring keeps only designer-relevant launches."

  # --- Ukrainian voices (UA segment) ---
  ukrainian:
    - name: "Telegraf.design"
      url: "https://telegraf.design/feed/"
      weight: 1.2
      lang: uk
      tags: [ua, design, magazine]
      notes: "Verified live. UA design coverage."
    # TODO (Alex): додай UA AI-design Substack-и / Telegram-канали / Projector,
    # коли підтвердиш, що вони активні в 2026.


# =============================================================================
# QUARANTINE — removed from fetch in v4. These flooded the channel with
# infra/model-race content. Re-enable ONLY with a strong design angle + low weight.
# =============================================================================
quarantine:
  reason: "High-volume infra / model-race / frontend-lib feeds that buried design news."
  items:
    - name: "Vercel blog (atom)"
      url: "https://vercel.com/atom"
      why: "1294 items, ships constantly — single biggest source of Vercel spam."
    - name: "arXiv cs.AI"
      url: "https://export.arxiv.org/rss/cs.AI"
      why: "Academic AI papers, almost never about design."
    - name: "Tailwind CSS blog"
      url: "https://tailwindcss.com/feeds/feed.xml"
      why: "Pure frontend lib, off-brand for a designer channel."
    - name: "shadcn/ui releases"
      url: "https://github.com/shadcn-ui/ui/releases.atom"
      why: "Component-lib changelog — too granular/eng for the audience."
    - name: "Apple Developer News"
      url: "https://developer.apple.com/news/rss/news.rss"
      why: "Mostly dev/SDK; re-add a HIG-filtered query if wanted."
    - name: "Google Developers Blog"
      url: "https://developers.googleblog.com/feeds/posts/default?alt=rss"
      why: "Mostly dev; Material/Gemini design news better caught via Google News."


