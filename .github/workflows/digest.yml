name: Design Signal Digest

# Cron runs every 6 hours (08:00, 14:00, 20:00, 02:00 Kyiv time approx.)
# GitHub crons use UTC; Kyiv is UTC+2 (winter) / UTC+3 (summer)
# Change schedule to taste — keep total runs/day reasonable to fit free tier.
on:
  schedule:
    - cron: '0 6,12,18 * * *'   # 09:00, 15:00, 21:00 Kyiv (winter)
  workflow_dispatch:             # allows manual triggering from GitHub UI

# Allow workflow to commit state.json back to repo
permissions:
  contents: write

jobs:
  run-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run digest agent
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_USER_ID: ${{ secrets.TELEGRAM_USER_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_SCORING_MODEL: 'gemini-2.5-flash'
          GEMINI_COMPOSING_MODEL: 'gemini-2.5-pro'
          MIN_SCORE_TO_PUBLISH: '7'
          MAX_POSTS_PER_RUN: '2'
          DRY_RUN: 'false'
        run: python -m src.main

      - name: Commit updated state
        # Only commits if state.json actually changed
        run: |
          if [[ -n $(git status --porcelain state.json) ]]; then
            git config user.name "design-signal-bot"
            git config user.email "actions@github.com"
            git add state.json
            git commit -m "chore: update state [skip ci]"
            git push
          else
            echo "No state changes to commit."
          fi
