name: Design Signal Digest

# TESTING MODE: every hour to quickly evaluate post quality.
# PRODUCTION TARGET: once a day at 09:30 Kyiv (summer UTC+3) = 06:30 UTC.
#   Cron line: '30 6 * * *'
# GitHub Actions cron drifts 5-15 min — that's fine for our use case.
on:
  schedule:
    - cron: '0 * * * *'         # every hour, on the hour (UTC)
  workflow_dispatch:             # allows manual triggering from GitHub UI

# Allow workflow to commit state.json back to repo
permissions:
  contents: write

jobs:
  run-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run digest agent
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_USER_ID: ${{ secrets.TELEGRAM_USER_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_SCORING_MODEL: 'claude-haiku-4-5-20251001'
          CLAUDE_COMPOSING_MODEL: 'claude-sonnet-4-6'
          MIN_SCORE_TO_PUBLISH: '6'
          MAX_POSTS_PER_RUN: '3'
          DRY_RUN: 'false'
          PYTHONUNBUFFERED: '1'
        run: python -u -m src.main

      - name: Commit updated state
        # Only commits if state.json actually changed
        run: |
          if [[ -n $(git status --porcelain state.json) ]]; then
            git config user.name "design-signal-bot"
            git config user.email "actions@github.com"
            git add state.json
            git commit -m "chore: update state [skip ci]"
            git push
          else
            echo "No state changes to commit."
          fi
