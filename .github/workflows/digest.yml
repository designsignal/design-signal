name: Design Signal Digest

# Scheduling is owned by cron-job.org (external) — it hits the GitHub API
# workflow_dispatch endpoint on a reliable schedule. GitHub's own scheduled
# cron is unreliable on free tier (heavy throttling), so we kept only
# manual / external triggers here. Single source of truth for "when does
# this run?" = cron-job.org dashboard.
on:
  workflow_dispatch:             # triggered by cron-job.org (and manual UI runs)

# Allow workflow to commit state.json back to repo
permissions:
  contents: write

# Opt into Node.js 24 runtime for JavaScript actions early (default June 2026).
# Silences the deprecation warning for actions/checkout@v4 and setup-python@v5.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  run-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # extra room for outage-recovery sleep (10 min) + retry pass

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run digest agent
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_USER_ID: ${{ secrets.TELEGRAM_USER_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_SCORING_MODEL: 'claude-haiku-4-5-20251001'
          CLAUDE_COMPOSING_MODEL: 'claude-sonnet-4-6'
          MIN_SCORE_TO_PUBLISH: '6'
          MAX_POSTS_PER_RUN: '3'
          DRY_RUN: 'false'
          PYTHONUNBUFFERED: '1'
        run: python -u -m src.main

      - name: Commit updated state
        # Only commits if state.json actually changed
        run: |
          if [[ -n $(git status --porcelain state.json) ]]; then
            git config user.name "design-signal-bot"
            git config user.email "actions@github.com"
            git add state.json
            git commit -m "chore: update state [skip ci]"
            git push
          else
            echo "No state changes to commit."
          fi
